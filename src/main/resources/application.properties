spring.application.name=contest

# 从 .env 加载环境变量（KEY=VALUE，properties 格式）；文件缺失不报错（optional）
# 兼容不同启动工作目录：demo/ 下用 ./.env；仓库根目录下用 ./demo/.env
# .env 已在 .gitignore 中忽略，用于存放数据库账号密码等敏感信息，严禁提交
spring.config.import=optional:file:./.env[.properties],optional:file:./demo/.env[.properties],optional:file:../.env[.properties]

# MySQL —— 数据库凭据一律通过环境变量注入，严禁在代码/配置中写明文（见 .env.example）
# URL 属环境配置，可用 DB_URL 覆盖；账号/密码必须由 DB_USERNAME / DB_PASSWORD 提供（无默认值，未设置则启动失败）
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/contest_db?serverTimezone=Asia/Shanghai&connectionCollation=utf8mb4_unicode_ci}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis-Plus
mybatis-plus.mapper-locations=classpath:mapper/*.xml
mybatis-plus.type-aliases-package=com.zhk.contest.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl
mybatis-plus.global-config.db-config.id-type=auto

# File Upload
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=210MB

# Custom File Storage
#file.upload-dir=./uploads
file.upload-dir=/www/wwwroot/contest

# Session
server.servlet.session.timeout=30m

# Server
#server.port=8123
server.port=8080
spring.web.resources.add-mappings=false

# CORS — 允许的跨域来源（逗号分隔）
# 本地开发端口 + 生产环境子域名（http/https）
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:3000,http://cs.chuangsaiying.cn,https://cs.chuangsaiying.cn,http://gly.chuangsaiying.cn,https://gly.chuangsaiying.cn

# 初始化账号密码 —— 仅首次启动、对应账号不存在时使用；通过环境变量注入，不设明文默认值
# 若创建超级管理员时 INIT_SUPER_ADMIN_PASSWORD 为空，将自动生成随机密码并打印到日志（仅一次）
app.init.super-admin-username=${INIT_SUPER_ADMIN_USERNAME:}
app.init.super-admin-password=${INIT_SUPER_ADMIN_PASSWORD:}
app.init.default-admin-password=${INIT_DEFAULT_ADMIN_PASSWORD:}
